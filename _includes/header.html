<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Adeline Lalor home">
    <span class="wordmark__name">Adeline Lalor</span>
    <span class="wordmark__descriptor">Product · AI · Growth</span>
  </a>
  <div class="header-actions">
    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark theme" aria-pressed="false">
      <span class="theme-toggle__mark" aria-hidden="true">◐</span>
      <span>Theme</span>
    </button>
  </div>
</header>
